[project]
name = "api"
version = "0.1.0"
description = "Mentecobre to manage the translation of Coppermind to Spanish"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django==6.1.0",
    "django-cors-headers>=4.4.0",
    "django-environ==0.13.0",
    "django-extensions==4.0",
    "django-filter==25.2",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular==0.30.0",
    "drf-standardized-errors==0.16.0",
    "psycopg[binary]>=3.3.4",
    "pyjwt>=2.10",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-subtests>=0.15.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
addopts ="-sv --disable-pytest-warnings --migrations"
nonrecursedirs= "auth_migrations migrations"
python_files = ["test_*.py", "tests.py", "_tests.py"]
