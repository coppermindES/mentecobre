[project]
name = "mentecobre"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "api",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.10",
    "pre-commit>=4.5.1",
    "ruff>=0.15.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
